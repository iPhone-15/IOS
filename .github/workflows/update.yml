name: Auto Update JAV List

on:
  schedule:
    - cron: '0 16 * * *' # 每天台灣時間 00:00 執行
  workflow_dispatch:      # 允許手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 修改點 1：只需要 requests，不需要 beautifulsoup4 了
      - name: Install dependencies
        run: |
          pip install requests

      # 修改點 2：請確保這裡的文件名與您上傳的 Python 文件名完全一致
      # 如果您把新代碼存為 scraper_v2.py，這裡就要改。
      # 如果您是直接覆蓋了原來的 scraper.py，這裡就不用動。
      - name: Run Scraper
        run: python scraper.py 

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add jav_manufacturers.list
          # 防止因為沒有新更新導致報錯
          git commit -m "Auto-update domain list [skip ci]" || exit 0
          git push
